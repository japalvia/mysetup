# Clear terminal with Contro-Shift-l
bind -n C-S-l clear-history

# Selecting text stops at pane edge
# set-option -g mouse on
# Toggle mouse on/off
bind-key m \
    set-option -gF mouse "#{?mouse,off,on}" ; \
    display-message "#{?mouse,Mouse: ON,Mouse: OFF}"

set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",xterm-256color:Tc"

# Enable automatic window renaming
set-window-option -g allow-rename on
set-option -sg automatic-rename on

# Set the format for the window name to the current working directory
set-option -sg automatic-rename-format "#{b:pane_current_path}"

# reload changes in tmux
unbind r
bind r source-file ~/.tmux.conf


# Reset SSH_AUTH_SOCK path on reattach
# https://gist.github.com/jvkersch/e7ef80dea675524d332f
setenv -g SSH_AUTH_SOCK $HOME/.ssh/ssh_auth_sock
set -g update-environment -r

# escape-time affects vim esc
set -sg escape-time 10

# TODO alacritty search enter key, is this needed?
set -g allow-passthrough on

# tmux plugins with tpm
# Installing new plugins: https://github.com/tmux-plugins/tpm
# Remember to install new plugin: prefix-I
set -g @plugin 'tmux-plugins/tpm'
# https://andrewjamesjohnson.com/restoring-tmux-sessions/
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

# Match nvim by name, not by path: the binary lives behind an AppImage/squashfs
# path that changes, so the saved absolute path is never valid on restore.
# '*' replays the saved file arguments.
set -g @resurrect-processes '"~nvim->nvim *"'

# Restore scrollback, otherwise restored panes come back empty.
set -g @resurrect-capture-pane-contents 'on'

set -g @continuum-save-interval '15'
set -g @continuum-restore 'on'

set -g @plugin 'egel/tmux-gruvbox'
set -g @tmux-gruvbox 'dark256'


# Smart pane switching with awareness of Vim splits.
# See: https://github.com/christoomey/vim-tmux-navigator
set -g @plugin 'christoomey/vim-tmux-navigator'

# The stock check asks "is a vim running on this pane's tty?". A devbox editor is not:
# it lives on the container's own pty, so the pane only ever shows bash, the `devbox
# editor` launcher and the podman client, and C-h/C-j/C-k/C-l would always move panes
# instead of ever reaching neovim. So match the launcher as well. The upstream pattern
# is kept for host neovim, and the [^TXZ] state guard applies to both: a launcher
# stopped by Ctrl-Z reads as "not vim", which is what you want while you are sitting at
# the shell prompt it handed back.
#
# The uid column is the other departure from upstream, and it matters on a shared box.
# `ps -t` selects by the tty's device *number*, so a process whose terminal is gone but
# whose stale device number gets recycled still shows up for whoever is handed that
# number next - including other users' editors. Seen for real here: another user's
# orphaned `vi` on a recycled pts made this check answer "yes, vim" for an unrelated
# pane. Anchoring on `id -u` keeps the answer about your own processes. (ps -u would
# OR with -t rather than AND, hence doing it in the pattern.)
#
# Must be set before the tpm run line - the plugin reads this option when it loads.
set -g @vim_navigator_check "ps -o uid=,state=,comm= -t '#{pane_tty}' | grep -iqE '^ *'$(id -u)' +[^TXZ ]+ +(\\S+/)?g?\\.?(view|l?n?vim?x?|fzf)(diff)?(-wrapped)?$' || ps -o uid=,state=,args= -t '#{pane_tty}' | grep -qE '^ *'$(id -u)' +[^TXZ ]+ .*[ /]devbox editor( |$)'"

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'

